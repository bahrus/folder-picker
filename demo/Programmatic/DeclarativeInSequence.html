<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmatic declarative in sequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <button id="button" disabled>Pick directory</button>
    <p>After picking, inspect <code>button.enh.folderPicker.directoryHandle</code> in devtools.</p>
    <script type=module>
        import {defFolderPicker} from '/def.js';
        await defFolderPicker(document.body);
        //only the first call needs to use .set
        //it triggers the attachment of the enhancement.
        button.enh.set.folderPicker.options = {id: 'programmatic-demo', mode: 'read'};
        console.log(button.enh.folderPicker);
    </script>
</body>
</html>
