<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProgrammaticDeclarativeInSequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <!-- No folder-picker attribute at all -- the enhancement config is
         registered first, then properties are set via the `.set` proxy. -->
    <button id="subject" disabled>Pick directory</button>
    <script type=module>
        import {defFolderPicker} from '/def.js';
        await defFolderPicker(document.body);
        subject.enh.set.folderPicker.options = {id: 'programmatic', mode: 'read'};
    </script>
</body>
</html>
