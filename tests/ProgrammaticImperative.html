<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProgrammaticImperative</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <!-- Fully imperative attachment: no attribute, no `.set` proxy -- just
         `enh.get(emc)` plus a direct property assignment. -->
    <button id="subject" disabled>Pick directory</button>
    <script type=module>
        import {defFolderPicker} from '/def.js';
        const emc = await defFolderPicker(document.body);
        const folderPicker = subject.enh.get(emc);
        folderPicker.options = {id: 'programmatic', mode: 'read'};
    </script>
</body>
</html>
