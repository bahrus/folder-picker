<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProgrammaticDeclarativeOutOfSequence</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <!-- Properties are set via the `.set` proxy *before* the enhancement
         config is even registered. `.set` creates a plain placeholder and
         defers the real spawn until `defFolderPicker` registers the config,
         via EnhancementRegistry.whenDefined. -->
    <button id="subject" disabled>Pick directory</button>
    <script type=module>
        import {defFolderPicker} from '/def.js';
        subject.enh.set.folderPicker.options = {id: 'programmatic', mode: 'read'};
        await defFolderPicker(document.body);
    </script>
</body>
</html>
