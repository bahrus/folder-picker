<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProgrammaticNoNudge</title>
    <!-- #include virtual="/imports.html" -->
</head>
<body>
    <!-- noNudge set before spawn finishes must survive (see customData.propagate
         in emc.mjs), leaving the button disabled after hydration. -->
    <button id="subject" disabled>Pick directory</button>
    <script type=module>
        import {defFolderPicker} from '/def.js';
        const emc = await defFolderPicker(document.body);
        const folderPicker = subject.enh.get(emc);
        folderPicker.noNudge = true;
    </script>
</body>
</html>
